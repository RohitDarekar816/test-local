when:
  - event: manual
    branch: master
  - event: push
    branch: master

skip_clone: false

steps:
  - name: code-review
    image: sh
    commands:
      - rm -rf .woodpecker/
      - export QODO_API_KEY="$QODO_API_KEY"
      - export GOOGLE_CHAT_WEBHOOK_URL="$GOOGLE_CHAT_WEBHOOK_URL"
      #      - qodo code_review --exclude_files=".woodpecker/**,agents/**,node_modules/**,code_review.yml,agents/*,*.woodpecker/*,*.vscode,.vscode/*" --severity_threshold=low --ci
      # Setup git credentials first
      - git config --global credential.helper store
      - git config --global user.email "$GIT_COMMIT_EMAIL"
      - git config --global user.name "$GIT_COMMIT_NAME"
      # SECURITY: Add credentials for both Gitea (origin) and GitHub (mirror) to credential store
      - echo "https://$GITEA_USERNAME:$GITEA_PASSWORD@gitea.hivefinty.com" > ~/.git-credentials
      - echo "https://$GIT_USERNAME:$GIT_TOKEN@github.com" >> ~/.git-credentials
      - chmod 600 ~/.git-credentials
      # Fetch all refs from origin to ensure we have complete history
      - git fetch origin --prune --unshallow || git fetch origin --prune
      # Remove existing remote if it exists and add mirror
      - git remote remove mirror 2>/dev/null || true
      - git remote add mirror https://github.com/$GIT_USERNAME/test-local.git
      # Push all refs to mirror (complete mirror sync)
      - git push mirror --all --force
      - git push mirror --tags --force
    environment:
      QODO_API_KEY:
        from_secret: QODO_API_KEY
      GOOGLE_CHAT_WEBHOOK_URL:
        from_secret: GOOGLE_CHAT_WEBHOOK_URL
      GIT_TOKEN:
        from_secret: GIT_TOKEN
      GIT_USERNAME:
        from_secret: GIT_USERNAME
      GIT_COMMIT_EMAIL:
        from_secret: GIT_COMMIT_EMAIL
      GIT_COMMIT_NAME:
        from_secret: GIT_COMMIT_NAME
      GITEA_USERNAME:
        from_secret: GITEA_USERNAME
      GITEA_PASSWORD:
        from_secret: GITEA_TOKEN
