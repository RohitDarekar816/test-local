when:
  - event: manual
    branch: master
  - event: push
    branch: master

skip_clone: true

steps:
  - name: show-directory
    image: sh
    commands:
      - git clone https://admin:admin@gitea.hivefinty.com/admin/cartlog-admin.git
      - cd cartlog-admin
      - export QODO_API_KEY="$QODO_API_KEY"
      - export ROCKETCHAT_WEBHOOK_URL="$ROCKETCHAT_WEBHOOK_URL"
      - qodo code_review --ci
    environment:
      QODO_API_KEY:
        from_secret: QODO_API_KEY
      ROCKETCHAT_WEBHOOK_URL:
        from_secret: ROCKETCHAT_WEBHOOK_URL
