when:
  - event: push
    branch: master

steps:
  - name: host-info
    image: *no-image*
    commands:
      - echo "=== HOST MACHINE INFORMATION ==="
      - echo "User: $(whoami)"
      - echo "Hostname: $(hostname)"
      - echo "Working Directory: $(pwd)"
      - echo "Home Directory: $HOME"
      - echo "Shell: $SHELL"
      - echo "=============================="

  - name: host-commands
    image: *no-image*
    commands:
      - echo "=== RUNNING HOST COMMANDS ==="
      - echo "Current date: $(date)"
      - echo "Uptime: $(uptime -p)"
      - echo "Memory usage:"
      - free -h
      - echo "Disk usage:"
      - df -h /
      - echo "=============================="

  - name: file-operations
    image: *no-image*
    commands:
      - echo "=== FILE OPERATIONS ==="
      - mkdir -p /tmp/woodpecker-test
      - echo "Hello from Woodpecker on host!" > /tmp/woodpecker-test/hello.txt
      - echo "Created file:"
      - cat /tmp/woodpecker-test/hello.txt
      - echo "File contents verified successfully!"
      - echo "=============================="
