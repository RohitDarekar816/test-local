when:
  - event: manual
    branch: master
  - event: push
    branch: master

skip_clone: true

steps:
  - name: show-directory
    image: sh
    commands:
      - git clone https://admin:admin@gitea.hivefinty.com/admin/code_review_webhook.git
      - cd code_review_webhook
      - echo "start code review"
      - whoami
      - export QODO_API_KEY="${QODO_API_KEY}"
      - export ROCKETCHAT_WEBHOOK_URL="${ROCKETCHAT_WEBHOOK_URL}"
      - qodo code_review --ci
      #- git remote add mirror https://github.com/RohitDarekar816/mirror_pushing.git
