when:
  - event: push
    branch: master

steps:
  - name: build
    image: alpine:latest
    commands:
      - echo "This is the build step"
      - echo "binary-data-123" > executable
      - chmod +x executable
      - echo "Created executable with content:"
      - cat executable
  - name: test-commands
    image: alpine:latest
    commands:
      - echo "Testing basic commands..."
      - whoami
      - pwd
      - ls -la
      - echo "Testing executable creation in this step:"
      - echo "test-data" > test-file
      - cat test-file
